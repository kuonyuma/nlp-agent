id: review-tfidf-retrieval-v1
name: TF-IDF FAQ 检索复习单题
topic_id: tfidf-faq-retrieval
topic_name: TF-IDF 与 FAQ 检索
knowledge_point_id: tfidf-term-weighting
knowledge_point_name: TF-IDF 词项权重与检索
knowledge_markdown: |
  TF 表示词在单篇文档中的出现频率；IDF 表示词在文档集合中的稀有程度；TF-IDF 以两者乘积为查询词赋权，并累加候选 FAQ 的匹配信号进行排序。
instructions: |
  先用不超过两句话回顾 TF、IDF 与 TF-IDF 的关系，再只生成一道初学者简答复习题。题目必须回顾词频、稀有度和 FAQ 排序中的至少两项。收到答案后按 rubric 简洁指出已掌握点、需要纠正点和正确答案要点；不得发布第二题。
question_type: 简答复习题
rubric:
  - criterion: 回顾并区分 TF 的局部词频含义
    weight: 0.3
  - criterion: 回顾并区分 IDF 的全局稀有度含义
    weight: 0.3
  - criterion: 说明 TF-IDF 对 FAQ 相关度排序的作用
    weight: 0.4
status: enabled
