schema_version: "1.0"
suite:
  id: nlp-tool-routing-v1
  name: NLP 五工具路由评测集
  description: 覆盖单工具、多工具、调用顺序、相邻能力辨析和无需工具负样本。
  owner: Pro_NLP

defaults:
  workspace_id: eval-isolated
  repeats: 1
  timeout_seconds: 90
  expectation:
    allow_extra_tools: false
    forbidden_tools: []
    ordered_tools: []
    allowed_tool_statuses: [ok]

cases:
  - id: tfidf-basic-computation
    input: 给定文档“机器 学习 机器”和语料库共 10 篇、其中 2 篇包含“机器”，计算“机器”的 TF、IDF 和 TF-IDF，使用常用对数。
    tags: [tfidf, positive, single-tool, calculation, critical]
    expectation:
      required_tools: [nlp_tfidf_analyzer]

  - id: tfidf-keyword-ranking
    input: 对“自然语言处理可以处理自然语言”计算词项 TF-IDF，并按重要性从高到低列出关键词。
    tags: [tfidf, positive, single-tool, ranking]
    expectation:
      required_tools: [nlp_tfidf_analyzer]

  - id: tfidf-query-document-relevance
    input: 查询“退货 运费”，候选 FAQ 是“退货需要承担运费”“如何修改收货地址”“退款多久到账”，请用 TF-IDF 比较相关度并排序。
    tags: [tfidf, positive, single-tool, faq]
    expectation:
      required_tools: [nlp_tfidf_analyzer]

  - id: tfidf-chinese-tokenization
    input: 分词后语料为 [[自然语言, 处理], [自然语言, 理解], [图像, 处理]]，计算每个词的 DF、IDF 和第一篇文档的 TF-IDF。
    tags: [tfidf, positive, single-tool, chinese]
    expectation:
      required_tools: [nlp_tfidf_analyzer]

  - id: tfidf-concept-only
    input: 不需要计算，请用一句话解释为什么常见词的 IDF 通常较低。
    tags: [tfidf, negative, no-tool, concept]
    expectation:
      required_tools: []
      expected_no_tool: true

  - id: tfidf-vs-word-frequency-concept
    input: 只做概念辨析：TF-IDF 和单纯词频最大的区别是什么？不要举计算例子。
    tags: [tfidf, negative, no-tool, concept]
    expectation:
      required_tools: []
      expected_no_tool: true

  - id: pr-curve-threshold-table
    input: 真实标签为 [1,0,1,0,1]，预测概率为 [0.9,0.8,0.7,0.4,0.2]，列出所有阈值下的 Precision、Recall、F1 和 PR 曲线坐标。
    tags: [precision-recall, positive, single-tool, critical]
    expectation:
      required_tools: [nlp_precision_recall_curve]

  - id: pr-best-f1-threshold
    input: y_true=[1,1,0,1,0,0]，scores=[0.95,0.62,0.60,0.51,0.40,0.10]，找出最佳 F1 阈值并给出对应混淆矩阵。
    tags: [precision-recall, positive, single-tool, threshold]
    expectation:
      required_tools: [nlp_precision_recall_curve]

  - id: pr-fixed-threshold
    input: 标签 [1,0,1,1]、概率 [0.8,0.7,0.6,0.1]，重点分析阈值 0.5 时的 TP、FP、FN、Precision 和 Recall。
    tags: [precision-recall, positive, single-tool, confusion-matrix]
    expectation:
      required_tools: [nlp_precision_recall_curve]

  - id: pr-curve-tradeoff
    input: 用标签 [1,0,1,0] 和概率 [0.9,0.65,0.55,0.2] 演示阈值降低时 Precision 与 Recall 如何变化。
    tags: [precision-recall, positive, single-tool, explanation]
    expectation:
      required_tools: [nlp_precision_recall_curve]

  - id: pr-definition-only
    input: 不进行任何计算，只解释 Precision 和 Recall 分别关注什么。
    tags: [precision-recall, negative, no-tool, concept]
    expectation:
      required_tools: []
      expected_no_tool: true

  - id: precision-at-n-basic
    input: 排序检索结果的相关性为 [true,false,true,true,false]，计算 Precision@1、@3 和 @5。
    tags: [precision-at-n, positive, single-tool, critical]
    expectation:
      required_tools: [nlp_precision_at_n]

  - id: precision-at-custom-n
    input: 前 8 条结果相关性为 [1,1,0,0,1,0,1,0]，计算 Precision@2、Precision@4 和 Precision@7，并标出相关项。
    tags: [precision-at-n, positive, single-tool, boundary]
    expectation:
      required_tools: [nlp_precision_at_n]

  - id: precision-at-n-all-relevant
    input: 一个 FAQ 系统前 5 条结果全部相关，请核算 P@1、P@3、P@5。
    tags: [precision-at-n, positive, single-tool, boundary]
    expectation:
      required_tools: [nlp_precision_at_n]

  - id: precision-at-n-none-relevant
    input: 检索结果相关性是 [false,false,false]，计算 P@1 和 P@3。
    tags: [precision-at-n, positive, single-tool, boundary]
    expectation:
      required_tools: [nlp_precision_at_n]

  - id: precision-at-n-concept-only
    input: 不计算，请说明 Precision@N 为什么依赖结果顺序。
    tags: [precision-at-n, negative, no-tool, concept]
    expectation:
      required_tools: []
      expected_no_tool: true

  - id: ngram-generate-one-to-four
    input: 将句子“The guard arrived late”分词，并生成 1-gram 到 4-gram 及各自计数。
    tags: [ngram, positive, single-tool, critical]
    expectation:
      required_tools: [nlp_ngram_analyzer]

  - id: ngram-match-clipped-count
    input: 候选句“the the cat”，参考句“the cat”，展示 unigram 和 bigram 的匹配、未匹配及 clipped count。
    tags: [ngram, positive, single-tool, clipping]
    expectation:
      required_tools: [nlp_ngram_analyzer]

  - id: ngram-chinese-pretokenized
    input: 候选词序列 [我, 喜欢, 自然语言处理]，参考词序列 [我, 热爱, 自然语言处理]，比较 1-gram 和 2-gram。
    tags: [ngram, positive, single-tool, chinese]
    expectation:
      required_tools: [nlp_ngram_analyzer]

  - id: ngram-trigram-only
    input: 比较“a b c d”和“a b x d”的 3-gram，只列出匹配与未匹配项。
    tags: [ngram, positive, single-tool]
    expectation:
      required_tools: [nlp_ngram_analyzer]

  - id: ngram-definition-only
    input: 不生成任何序列，只解释 bigram 和 trigram 的区别。
    tags: [ngram, negative, no-tool, concept]
    expectation:
      required_tools: []
      expected_no_tool: true

  - id: bleu-course-example
    input: 参考句“The guard arrived late because it was raining”，候选句“The guard arrived late because of the rain”，按课件公式计算四阶 Sentence BLEU，展示各阶 modified precision、几何平均和 BP。
    tags: [bleu, positive, single-tool, course-example, critical]
    expectation:
      required_tools: [nlp_bleu_score]

  - id: bleu-short-candidate
    input: 参考句“the cat is on the mat”，候选句“the cat”，计算 BLEU 并重点展示长度惩罚。
    tags: [bleu, positive, single-tool, brevity-penalty]
    expectation:
      required_tools: [nlp_bleu_score]

  - id: bleu-identical-sentences
    input: 候选句和参考句都是“natural language processing is useful”，计算四阶 Sentence BLEU。
    tags: [bleu, positive, single-tool, boundary]
    expectation:
      required_tools: [nlp_bleu_score]

  - id: bleu-multiple-references
    input: 候选句“the cat sits on the mat”，参考句有“the cat is on the mat”和“a cat sits on the mat”，计算多参考 Sentence BLEU。
    tags: [bleu, positive, single-tool, multi-reference]
    expectation:
      required_tools: [nlp_bleu_score]

  - id: bleu-corpus
    input: 有两组候选译文与参考译文，请计算 Corpus BLEU：候选 [“the cat is here”, “it is raining”]，参考 [“the cat is here”, “it is raining today”]。
    tags: [bleu, positive, single-tool, corpus]
    expectation:
      required_tools: [nlp_bleu_score]

  - id: bleu-formula-only
    input: 不代入句子、不计算，只写出 BLEU 的 Brevity Penalty 公式并说明何时等于 1。
    tags: [bleu, negative, no-tool, concept]
    expectation:
      required_tools: []
      expected_no_tool: true

  - id: faq-ranking-then-p-at-n
    input: 用 TF-IDF 将查询“退款时间”与 5 条 FAQ 按相关度排序，然后根据相关标签 [true,true,false,true,false] 计算排序后的 Precision@1、@3、@5。
    tags: [cross-tool, tfidf, precision-at-n, multi-tool, ordered, critical]
    expectation:
      required_tools: [nlp_tfidf_analyzer, nlp_precision_at_n]
      ordered_tools: [nlp_tfidf_analyzer, nlp_precision_at_n]

  - id: pr-and-p-at-n-comparison-with-data
    input: 先对标签 [1,0,1,0] 和概率 [0.9,0.8,0.7,0.1] 生成 PR 曲线；再把同一排序视为检索结果，计算 Precision@2 和 @4。
    tags: [cross-tool, precision-recall, precision-at-n, multi-tool, ordered]
    expectation:
      required_tools: [nlp_precision_recall_curve, nlp_precision_at_n]
      ordered_tools: [nlp_precision_recall_curve, nlp_precision_at_n]

  - id: ngram-detail-then-bleu
    input: 先展示候选“the guard arrived late”和参考“the guard came late”的 1-gram 到 4-gram 匹配细节，再用这些句子计算 BLEU。
    tags: [cross-tool, ngram, bleu, multi-tool, ordered, critical]
    expectation:
      required_tools: [nlp_ngram_analyzer, nlp_bleu_score]
      ordered_tools: [nlp_ngram_analyzer, nlp_bleu_score]

  - id: bleu-only-not-tfidf
    input: 计算候选“a b c”和参考“a b d”的 BLEU；不要做关键词权重或检索评价。
    tags: [bleu, distractor, forbidden]
    expectation:
      required_tools: [nlp_bleu_score]
      forbidden_tools: [nlp_tfidf_analyzer, nlp_precision_at_n]

  - id: pr-only-not-p-at-n
    input: 根据真实标签和预测概率画 PR 曲线，不要把它当成检索结果计算 Precision@N：labels=[1,0,1]，scores=[0.8,0.6,0.4]。
    tags: [precision-recall, distractor, forbidden, critical]
    expectation:
      required_tools: [nlp_precision_recall_curve]
      forbidden_tools: [nlp_precision_at_n]

  - id: translation-request-no-evaluation
    input: 请把“自然语言处理很有趣”翻译成英文，不需要 BLEU 或任何评测。
    tags: [negative, no-tool, translation, distractor]
    expectation:
      required_tools: []
      expected_no_tool: true
      forbidden_tools: [nlp_bleu_score, nlp_ngram_analyzer]

  - id: ner-request-no-current-tool
    input: 从“张三在北京大学学习”中识别人名和机构实体。
    tags: [negative, no-tool, ner, future-capability]
    expectation:
      required_tools: []
      expected_no_tool: true

  - id: summarize-request-no-tool
    input: 请把这句话概括成五个字：“自然语言处理让计算机理解和生成人类语言”。
    tags: [negative, no-tool, summarization]
    expectation:
      required_tools: []
      expected_no_tool: true

  - id: greeting-no-tool
    input: 你好，请介绍一下你能帮助我学习哪些 NLP 内容。
    tags: [negative, no-tool, conversation]
    expectation:
      required_tools: []
      expected_no_tool: true
