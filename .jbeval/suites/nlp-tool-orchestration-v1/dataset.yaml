schema_version: "1.0"
suite:
  id: nlp-tool-orchestration-v1
  name: NLP 多工具 Coordinator/Worker 编排评测集
  description: 独立于单工具路由集；验证复杂任务的任务分配、Worker 工具归属和工具链。
  owner: Pro_NLP
defaults:
  workspace_id: eval-orchestration
  repeats: 1
  timeout_seconds: 180
  expectation:
    allow_extra_tools: true
    allowed_tool_statuses: [ok]
cases:
  - id: course-lab-two-independent-analyses
    input: 我在准备一节 NLP 实验课。请分别完成两份可独立开展的分析：第一份用 TF-IDF 对查询“退款时间”和三条 FAQ（“退款多久到账”“如何修改地址”“退货运费谁承担”）排序；第二份用标签[1,0,1,0]、概率[0.9,0.8,0.7,0.2]给出 PR 曲线和最佳 F1。最后整理成教师可直接使用的综合教学表，并说明两部分如何安排。
    tags: [orchestration, parallel, critical]
    expectation:
      delegation_policy: required
      required_tools: [nlp_tfidf_analyzer, nlp_precision_recall_curve]
      min_workers: 2
      max_workers: 2
      min_dispatches: 2
      max_dispatches: 2
      require_join: true
      required_wait_mode: all
      orchestration_mode: parallel
      worker_required_tools: [nlp_tfidf_analyzer, nlp_precision_recall_curve]
      final_response_terms: [TF-IDF, F1]
  - id: lesson-plan-bleu-and-retrieval
    input: 请为机器翻译与检索评估设计一份课堂讲义素材：计算候选“the cat sits on the mat”相对参考“the cat is on the mat”的 BLEU；同时对相关性[true,false,true,true,false]计算 P@1、P@3、P@5。两项分析相互独立，但都需要在同一节课中展示，请给出完整结果和适用场景对比。
    tags: [orchestration, parallel]
    expectation:
      delegation_policy: required
      required_tools: [nlp_bleu_score, nlp_precision_at_n]
      min_workers: 2
      max_workers: 2
      min_dispatches: 2
      max_dispatches: 2
      require_join: true
      required_wait_mode: all
      orchestration_mode: parallel
      worker_required_tools: [nlp_bleu_score, nlp_precision_at_n]
      final_response_terms: [BLEU, Precision@]
  - id: ngram-to-bleu-teaching-chain
    input: 为帮助学生理解 BLEU 的来源，请先分析候选“the the cat”和参考“the cat”的 unigram/bigram 匹配与 clipped count，再据同一数据计算 BLEU，最后解释前一步的匹配统计怎样影响后一步的分数。请组织成一段连贯的教学演示。
    tags: [orchestration, sequential, critical]
    expectation:
      delegation_policy: preferred
      required_tools: [nlp_ngram_analyzer, nlp_bleu_score]
      ordered_tools: [nlp_ngram_analyzer, nlp_bleu_score]
      min_workers: 2
      max_workers: 2
      min_dispatches: 2
      max_dispatches: 2
      require_join: true
      required_wait_mode: all
      orchestration_mode: sequential
      worker_required_tools: [nlp_ngram_analyzer, nlp_bleu_score]
      final_response_terms: [clipped, BLEU]
  - id: three-metric-course-preparation
    input: 下周要上一次综合实验课，请准备三份可独立审核的计算材料：TF-IDF（文档“机器 学习 机器”，语料10篇、df=2）、PR 曲线（标签[1,0,1]、概率[0.9,0.8,0.2）和 Precision@N（相关性[true,false,true]、N=1,3）。最后汇总三种指标的对象、公式和应用，并给出教师备课时的核对建议。
    tags: [orchestration, parallel, critical]
    expectation:
      delegation_policy: required
      required_tools: [nlp_tfidf_analyzer, nlp_precision_recall_curve, nlp_precision_at_n]
      min_workers: 3
      max_workers: 3
      min_dispatches: 3
      max_dispatches: 3
      require_join: true
      required_wait_mode: all
      orchestration_mode: parallel
      worker_required_tools: [nlp_tfidf_analyzer, nlp_precision_recall_curve, nlp_precision_at_n]
      final_response_terms: [TF-IDF, Precision, Recall]
  - id: simple-two-calculations-no-delegation
    input: 请直接计算两项课堂小练习：标签[1,0,1]、概率[0.9,0.8,0.2]的最佳 F1 阈值；以及相关性[true,false,true]的 P@1、P@3。用简短答案给出结果。
    tags: [orchestration, simple-multi-tool, no-worker, critical]
    expectation:
      delegation_policy: forbidden
      required_tools: [nlp_precision_recall_curve, nlp_precision_at_n]
      max_workers: 0
      max_dispatches: 0
      final_response_terms: [F1, P@]
  - id: independent-translation-and-ranking-lab
    input: 为课堂设计一份包含两项独立实验的讲义：实验一计算候选“the cat is on mat”相对参考“the cat is on the mat”的 BLEU，并解释长度惩罚；实验二对查询“退货运费”与 FAQ“退货需要承担运费”“如何修改收货地址”“退款多久到账”进行 TF-IDF 排序。最后给出两项实验的教学目标与常见误区。
    tags: [orchestration, parallel, critical, expanded]
    expectation:
      delegation_policy: required
      required_tools: [nlp_bleu_score, nlp_tfidf_analyzer]
      min_workers: 2
      max_workers: 2
      min_dispatches: 2
      max_dispatches: 2
      require_join: true
      required_wait_mode: all
      orchestration_mode: parallel
      worker_required_tools: [nlp_bleu_score, nlp_tfidf_analyzer]
      final_response_terms: [BLEU, TF-IDF]
  - id: independent-pr-ngram-workbook
    input: 请制作一份可审核的 NLP 练习册答案：一部分基于标签[1,0,1,0]与概率[0.9,0.7,0.6,0.1]计算 PR 曲线；另一部分比较“a b c d”和“a b x d”的 1-gram、2-gram 与 3-gram 匹配。最后将两部分的评估对象和使用边界整理成表。
    tags: [orchestration, parallel, expanded]
    expectation:
      delegation_policy: required
      required_tools: [nlp_precision_recall_curve, nlp_ngram_analyzer]
      min_workers: 2
      max_workers: 2
      min_dispatches: 2
      max_dispatches: 2
      require_join: true
      required_wait_mode: all
      orchestration_mode: parallel
      worker_required_tools: [nlp_precision_recall_curve, nlp_ngram_analyzer]
      final_response_terms: [Precision, n-gram]
