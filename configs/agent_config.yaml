defaults:
  coordinator: coordinator-pro
  worker: worker-flash

# The local Backend Gateway is the only process allowed to own Agent runtime
# state. FastAPI/HTTP adapters should connect to it instead of constructing a
# second LangGraph or Worker runtime.
gateway:
  database: .data/gateway/gateway.sqlite3
  single_process: true
  stream_queue_size: 500
  shutdown_grace_s: 30
  event_retention_days: 7
  max_events_per_session: 50000
  retention_cleanup_interval_s: 3600

# FastAPI is a same-origin network adapter. It owns HTTP/WebSocket concerns,
# while BackendGateway remains the only owner of Agent runtime state.
web:
  host: 127.0.0.1
  port: 8765
  cookie_name: nlp_session
  cookie_ttl_s: 86400
  cookie_secure: false
  allowed_hosts: [127.0.0.1, localhost, testserver]
  allowed_origins: [http://127.0.0.1:8765, http://localhost:8765, http://127.0.0.1:5173]
  max_ws_message_bytes: 1048576
  ws_send_queue_size: 256
  ws_send_timeout_s: 10
  ws_ping_interval_s: 20
  ws_ping_timeout_s: 20
  ws_max_connections: 200
  ws_max_connections_per_user: 10
  static_dir: webui/dist

# The developer monitor is a separate read-mostly process. It never owns the
# Agent/Gateway lifecycle and therefore cannot slow down student chat traffic.
monitor:
  host: 127.0.0.1
  port: 8766
  cookie_name: nlp_monitor_session
  cookie_ttl_s: 28800
  cookie_secure: false
  allowed_hosts: [127.0.0.1, localhost, testserver]
  allowed_origins: [http://127.0.0.1:8766, http://localhost:8766, http://127.0.0.1:5174]
  static_dir: webui/monitor-dist

providers:
  deepseek:
    adapter: deepseek
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    default_headers: {}

models:
  deepseek-v4-flash:
    provider: deepseek
    model_id: deepseek-v4-flash
    context_window_tokens: 1000000
    max_output_tokens: 384000
    capabilities: {streaming: true, tool_calls: true, thinking: true, cache_usage: true, json_mode: true}

  deepseek-v4-pro:
    provider: deepseek
    model_id: deepseek-v4-pro
    context_window_tokens: 1000000
    max_output_tokens: 384000
    capabilities: {streaming: true, tool_calls: true, thinking: true, cache_usage: true, json_mode: true}

model_presets:
  coordinator-pro:
    model: deepseek-v4-pro
    thinking: {enabled: true, effort: max}
    generation: {max_output_tokens: 32000}
    timeouts: {connect_s: 10, first_token_s: 180, stream_idle_s: 90, total_s: 600}
    retry: {max_attempts: 3, base_delay_s: 1, max_delay_s: 12, jitter: full}
    circuit_breaker: {failure_threshold: 5, cooldown_s: 60}

  coordinator-fast:
    model: deepseek-v4-flash
    thinking: {enabled: true, effort: high}
    generation: {max_output_tokens: 24000}
    timeouts: {connect_s: 10, first_token_s: 120, stream_idle_s: 60, total_s: 360}
    retry: {max_attempts: 2, base_delay_s: 1, max_delay_s: 8, jitter: full}
    circuit_breaker: {failure_threshold: 5, cooldown_s: 60}

  worker-flash:
    model: deepseek-v4-flash
    thinking: {enabled: true, effort: high}
    generation: {max_output_tokens: 24000}
    timeouts: {connect_s: 10, first_token_s: 120, stream_idle_s: 60, total_s: 360}
    retry: {max_attempts: 3, base_delay_s: 1, max_delay_s: 12, jitter: full}
    circuit_breaker: {failure_threshold: 5, cooldown_s: 60}

  worker-pro:
    model: deepseek-v4-pro
    thinking: {enabled: true, effort: high}
    generation: {max_output_tokens: 32000}
    timeouts: {connect_s: 10, first_token_s: 180, stream_idle_s: 90, total_s: 600}
    retry: {max_attempts: 2, base_delay_s: 1, max_delay_s: 8, jitter: full}
    circuit_breaker: {failure_threshold: 5, cooldown_s: 60}

  utility-flash:
    model: deepseek-v4-flash
    thinking: {enabled: false, effort: none}
    generation: {max_output_tokens: 12000, temperature: 0.1}
    timeouts: {connect_s: 10, first_token_s: 90, stream_idle_s: 45, total_s: 240}
    retry: {max_attempts: 3, base_delay_s: 1, max_delay_s: 12, jitter: full}
    circuit_breaker: {failure_threshold: 5, cooldown_s: 60}

model_routes:
  coordinator:
    primary: coordinator-pro
    fallbacks: [coordinator-fast]
  worker:
    primary: worker-flash
    fallbacks: [worker-pro]
  utility:
    primary: utility-flash
    fallbacks: []

# Local memory stays under one root (.data/memory) and is internally scoped by
# workspace/user/session. Durable Markdown is injected directly; no vector RAG.
memory:
  enabled: true
  max_injection_tokens: 6000
  max_topics: 12
  recent_archive_tokens: 2000
  curate_after_archives: 8

# Prompt templates are Markdown assets under core/prompt_runtime/templates.
# Pin a version here when a versioned template (for example coordinator.v2.md)
# is introduced; undeclared or missing template variables fail before an LLM call.
prompts:
  versions: {}

# One logical Agent turn is bounded independently from provider-level retries
# and timeouts. Coordinator and Worker consume the same runtime contract.
agent_runtime:
  coordinator:
    max_iterations: 12
    max_duration_s: 600
    max_tokens: 128000
    max_tool_calls: 32
    max_injections: 15
    injection_batch_size: 3
    max_tool_result_chars: 50000
    finalize_on_exhaustion: true
  worker:
    max_injections: 15
    injection_batch_size: 3
    max_tool_result_chars: 50000
    finalize_on_exhaustion: true

# 工具注册、权限与扩展均在此处集中配置。未声明的工具不会被隐式授权。
tools:
  policies:
    coordinator:
      allowed_tools:
        - spawn_worker
        - send_message
        - TaskStop
        - read_local_file
        - get_current_time
      allowed_capabilities:
        - context.manage
      denied_capabilities:
        - business.write
    worker:
      allowed_tools: []
      allowed_capabilities: []
      denied_tools: []
      denied_capabilities:
        - runtime.control
        - worker.manage
  custom:
    modules: []
    entrypoint_group: nlp_agent.tools
  mcp_servers: {}
  # 示例：
  # mcp_servers:
  #   filesystem:
  #     transport: stdio
  #     command: npx
  #     args: ["-y", "@modelcontextprotocol/server-filesystem", ".data"]
  #     enabled_tools: ["read_file"]
  #     allow_private_network: false
  #     read_only_tools: ["read_file"]
  #     idempotent_tools: []
  #     high_risk_tools: []
  #     session_exclusive_tools: []
  #     global_exclusive_tools: []
  #     retry_attempts: 2
  #     max_concurrency: 1
  #     scopes: [worker]

# Profile 只组合 Skill、能力与工具授权；Skill 本身负责 SOP 指令。
worker_profiles: {}

# 可按智能体名称覆盖 Worker 模型。
