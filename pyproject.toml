[project]
name = "nlp-agent"
version = "0.15.0"
description = "A generic Coordinator/Worker NLP agent derived from Agentic-Travel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "langchain-core>=0.3",
    "langchain-deepseek>=0.1",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2",
    "mcp>=1.0",
    "openai>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["scripts", "tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
