name: Release Production

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nlp-agent

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Verify the release tag belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: verify-and-publish
    runs-on: [self-hosted, linux, production]
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy the immutable release image
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          COMPOSE_PROJECT_NAME: nova-prod
          NOVA_IMAGE: ghcr.io/${{ github.repository_owner }}/nlp-agent
          NOVA_TAG: ${{ needs.verify-and-publish.outputs.version }}
          NOVA_PULL_POLICY: always
        run: |
          test -n "$DEPLOY_DIR"
          test -f "$DEPLOY_DIR/.env"
          export NOVA_ENV_FILE="$DEPLOY_DIR/.env"
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_DIR/.env" -f compose.yaml pull nova-web
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_DIR/.env" -f compose.yaml up -d --no-build --remove-orphans nova-web
          for attempt in {1..12}; do
            if docker compose -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_DIR/.env" -f compose.yaml exec -T nova-web .venv/bin/python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health/ready')"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

  sync-gitee:
    needs: deploy
    uses: ./.github/workflows/sync-gitee.yml
    secrets: inherit
