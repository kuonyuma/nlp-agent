name: Sync Gitee Mirror

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
      - name: Trust the pre-verified Gitee host key
        env:
          GITEE_KNOWN_HOSTS: ${{ secrets.GITEE_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$GITEE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Mirror main and release tags
        run: |
          git fetch origin main --tags
          git remote add gitee git@gitee.com:futurepang/nlp-agent.git
          git push gitee refs/remotes/origin/main:refs/heads/main
          git push gitee --tags
