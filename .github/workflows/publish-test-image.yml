name: Publish Test Image

on:
  push:
    branches: [develop]

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-develop
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nlp-agent

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=develop
            type=sha,prefix=develop-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Test Environment
    needs: publish
    runs-on: [self-hosted, linux, test]
    environment: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy the published GHCR image
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          COMPOSE_PROJECT_NAME: nova-test
          NOVA_IMAGE: ghcr.io/${{ github.repository_owner }}/nlp-agent
          NOVA_TAG: develop
          NOVA_PULL_POLICY: always
        run: |
          test -n "$DEPLOY_DIR"
          test -f "$DEPLOY_DIR/.env"
          export NOVA_ENV_FILE="$DEPLOY_DIR/.env"
          test "$NOVA_IMAGE" = "ghcr.io/${{ github.repository_owner }}/nlp-agent"
          resolved_images="$(docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_DIR/.env" -f compose.yaml config --images)"
          printf '%s\n' "$resolved_images"
          printf '%s\n' "$resolved_images" | grep -Fxq "$NOVA_IMAGE:$NOVA_TAG" || {
            echo "Compose did not resolve the expected published image: $NOVA_IMAGE:$NOVA_TAG"
            exit 1
          }
          docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_DIR/.env" -f compose.yaml pull nova-web nova-monitor nginx
          docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_DIR/.env" -f compose.yaml up -d --no-build --remove-orphans nova-web nova-monitor nginx
          for attempt in {1..12}; do
            if docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_DIR/.env" -f compose.yaml exec -T nova-web .venv/bin/python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health/ready')" \
              && docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_DIR/.env" -f compose.yaml exec -T nova-monitor .venv/bin/python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/health/ready')" \
              && docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_DIR/.env" -f compose.yaml exec -T nginx wget -q -O - "http://127.0.0.1/health/live" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1
