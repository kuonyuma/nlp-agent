name: Deploy Test Environment

on:
  workflow_run:
    workflows: ["Publish Test Image"]
    branches: [develop]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, test]
    environment: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy the tested GHCR image
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          COMPOSE_PROJECT_NAME: nova-test
          NOVA_IMAGE: ghcr.io/${{ github.repository_owner }}/nlp-agent
          NOVA_TAG: develop
          NOVA_PULL_POLICY: always
        run: |
          test -n "$DEPLOY_DIR"
          test -f "$DEPLOY_DIR/.env"
          export NOVA_ENV_FILE="$DEPLOY_DIR/.env"
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_DIR/.env" -f compose.yaml pull nova-web
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_DIR/.env" -f compose.yaml up -d --no-build --remove-orphans nova-web
          for attempt in {1..12}; do
            if docker compose -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_DIR/.env" -f compose.yaml exec -T nova-web .venv/bin/python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health/ready')"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
